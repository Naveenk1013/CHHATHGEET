<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="80%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#b45309" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark sky rounded container -->
  <rect width="64" height="64" rx="16" fill="#0a1628" />

  <!-- Sun Rays -->
  <g stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="8" x2="32" y2="14" />
    <line x1="32" y1="50" x2="32" y2="56" />
    <line x1="8" y1="32" x2="14" y2="32" />
    <line x1="50" y1="32" x2="56" y2="32" />
    <line x1="15" y1="15" x2="19" y2="19" />
    <line x1="45" y1="45" x2="49" y2="49" />
    <line x1="15" y1="49" x2="19" y2="45" />
    <line x1="45" y1="19" x2="49" y2="15" />
  </g>

  <!-- Glowing Sun Body -->
  <circle cx="32" cy="32" r="13" fill="url(#sunGlow)" filter="url(#glow)" />

  <!-- Diya flame inside sun -->
  <path d="M32 23 C34 27 37 29 37 32.5 C37 35.2 34.8 37.5 32 37.5 C29.2 37.5 27 35.2 27 32.5 C27 29 30 27 32 23 Z" fill="#fffbeb" opacity="0.95" />
</svg>
