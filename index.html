        "@context": "https://schema.org",
        "@graph": [
            {

            },
            {
                "@type": "MusicPlaylist",
                "name": "छठी मैया के गीत",

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Background -->
    <div class="bg" aria-hidden="true"></div>

    <!-- Floating diya sparks -->
    <div class="particles" id="particles" aria-hidden="true"></div>

    <!-- Hidden YouTube iframe — actual sound source -->
    <div class="yt-host" aria-hidden="true"><div id="yt-player"></div></div>

    <!-- ── Top bar ─────────────────────────────────────────── -->
    <header class="topbar">
        <a href="explore.html" class="topbar__link" title="About Chhath Puja">
            <span class="topbar__label">जानिए</span>
        </a>

        <!-- Active Devotees Indicator -->
        <div class="presence" aria-live="polite">
            <span class="presence__dot" aria-hidden="true"></span>
            <span class="presence__count" id="listeners">108</span>
            <span class="presence__label">at the ghats</span>
        </div>

        <nav class="topbar__right" aria-label="Listen elsewhere">
            <a class="topbar__icon-link"
               href="https://music.youtube.com/playlist?list=PLEIQibB6Laz8&si=AR2O-MJOIsfLKcaO"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Open on YouTube Music"
               title="Open on YouTube Music">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm0 19.104c-3.924 0-7.104-3.18-7.104-7.104S8.076 4.896 12 4.896s7.104 3.18 7.104 7.104-3.18 7.104-7.104 7.104zm0-13.332c-3.432 0-6.228 2.796-6.228 6.228S8.568 18.228 12 18.228s6.228-2.796 6.228-6.228S15.432 5.772 12 5.772zM9.684 15.54V8.46L15.816 12l-6.132 3.54z"/>
                </svg>
            </a>
        </nav>
    </header>

    <main>
        <!-- ── Wordmark ────────────────────────────────────── -->
        <h1 class="logo" lang="hi">
            <span class="logo__line">छठ</span>
            <span class="logo__line">पूजा</span>
            <span class="sr-only" lang="en">Chhath Puja</span>
        </h1>

        <!-- ── Player dock ─────────────────────────────────── -->
        <div class="dock">

            <!-- Playlist panel (pops up over player) -->
            <section class="playlist-panel" id="playlistPanel" aria-label="Playlist">
                <div class="playlist-header">
                    <span class="playlist-title">छठी मैया के गीत</span>
                    <button class="playlist-close" id="playlistClose" type="button" aria-label="Close playlist" title="Close">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <ol id="playlistItems"></ol>
            </section>

            <!-- Rotating devotional couplet -->
            <p class="bumper">
                <span class="bumper__text" id="bumperText" lang="hi" aria-live="polite">कांच ही बांस के बहंगिया, बहंगी लचकत जाय</span>
                <button class="bumper__next" id="bumperNext" type="button" aria-label="Another couplet">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20 11.5A8 8 0 106.3 17.7"/>
                        <path d="M20 5.5v6h-6"/>
                    </svg>
                </button>
            </p>

            <!-- The Player -->
            <section class="player" id="player" aria-label="Player">

                <!-- Track metadata -->
                <div class="meta">
                    <p class="meta__title" id="title">छठी मैया के गीत…</p>
                    <p class="meta__artist" id="artist">&nbsp;</p>

                    <!-- Seek bar -->
                    <div class="seek" id="seek" role="slider" tabindex="0"
                         aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="seek__rail">
                            <div class="seek__fill" id="seekFill"></div>
                        </div>
                        <div class="seek__knob" id="seekKnob"></div>
                    </div>
                    <div class="time">
                        <span id="tCur">0:00</span>
                        <span class="time__sep">/</span>
                        <span id="tDur">0:00</span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button id="prev" type="button" class="ctrl-btn" aria-label="Previous track">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                        </svg>
                    </button>
                    <button id="play" type="button" class="ctrl-btn ctrl-btn--play" aria-label="Play" disabled>
                        <svg class="i-play" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg class="i-pause" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">
                            <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
                        </svg>
                    </button>
                    <button id="next" type="button" class="ctrl-btn" aria-label="Next track">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6z"/>
                        </svg>
                    </button>
                    <button id="listBtn" type="button" class="ctrl-btn ctrl-btn--toggle"
                            aria-label="Playlist" aria-expanded="false" aria-controls="playlistPanel">
                        <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
                            <path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-6.5l4 3-4 3z"/>
                        </svg>
                    </button>
                </div>
            </section>
        </div>
    </main>
